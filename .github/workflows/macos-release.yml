name: Build macOS Release

run-name: Build PinDB ${{ github.event.release.tag_name || inputs.tag }} for macOS

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pindb-macos-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  prepare:
    name: Validate macOS release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RAW_TAG="$RELEASE_TAG"
          VERSION="$RAW_TAG"

          if [[ "$VERSION" == v.* ]]; then
            VERSION="${VERSION#v.}"
          elif [[ "$VERSION" == v* ]]; then
            VERSION="${VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid PinDB release tag: $RAW_TAG"
            exit 1
          fi

          RELEASE_TAG_NAME="$(
            gh release view "$RAW_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName \
              --jq '.tagName'
          )"

          if [[ "$RELEASE_TAG_NAME" != "$RAW_TAG" ]]; then
            echo "Expected GitHub release tag $RAW_TAG, got $RELEASE_TAG_NAME."
            exit 1
          fi

          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PinDB macOS release version: $VERSION"

  build-macos:
    name: Build macOS ${{ matrix.release_arch }} PKG
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            release_arch: arm64
            machine_arch: arm64
          - runner: macos-15-intel
            release_arch: x64
            machine_arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ARCH="$(uname -m)"
          if [[ "$ACTUAL_ARCH" != "${{ matrix.machine_arch }}" ]]; then
            echo "Expected runner architecture ${{ matrix.machine_arch }}, got $ACTUAL_ARCH."
            exit 1
          fi

      - name: Build and test native PKG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean test packageMacPkg \
            -PappVersion="${{ needs.prepare.outputs.version }}"

      - name: Verify native PKG
        id: package
        shell: bash
        run: |
          set -euo pipefail
          PKG="build/packages/PinDB-${{ needs.prepare.outputs.version }}-macos-${{ matrix.release_arch }}.pkg"

          if [[ ! -s "$PKG" ]]; then
            echo "Expected macOS package is missing or empty: $PKG"
            exit 1
          fi

          bash packaging/macos/verify-package.sh \
            "$PKG" \
            "${{ matrix.release_arch }}" \
            "org.pindb.PinDB"

          echo "package=$PKG" >> "$GITHUB_OUTPUT"

      - name: Generate and verify SHA-256 checksum
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.package.outputs.package }}"
          PACKAGE_DIR="$(dirname "$PACKAGE")"
          PACKAGE_NAME="$(basename "$PACKAGE")"
          CHECKSUM_NAME="$PACKAGE_NAME.sha256"

          (
            cd "$PACKAGE_DIR"
            shasum -a 256 "$PACKAGE_NAME" > "$CHECKSUM_NAME"
            shasum -a 256 -c "$CHECKSUM_NAME"
            cat "$CHECKSUM_NAME"
          )

          echo "checksum=$PACKAGE.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pindb-macos-${{ needs.prepare.outputs.version }}-${{ matrix.release_arch }}
          path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.checksum.outputs.checksum }}
          if-no-files-found: error

  publish:
    name: Attach macOS packages to release
    needs:
      - prepare
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          EXPECTED=(
            "PinDB-${VERSION}-macos-arm64.pkg"
            "PinDB-${VERSION}-macos-arm64.pkg.sha256"
            "PinDB-${VERSION}-macos-x64.pkg"
            "PinDB-${VERSION}-macos-x64.pkg.sha256"
          )

          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#FILES[@]}" -ne 4 ]]; then
            echo "Expected exactly four macOS release files; found ${#FILES[@]}."
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          for NAME in "${EXPECTED[@]}"; do
            if [[ ! -s "release-assets/$NAME" ]]; then
              echo "Missing or empty macOS release asset: $NAME"
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum -c "PinDB-${VERSION}-macos-arm64.pkg.sha256"
            sha256sum -c "PinDB-${VERSION}-macos-x64.pkg.sha256"
          )

          printf '%s\n' "${FILES[@]}"

      - name: Stage and publish macOS release files transactionally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          RELEASE_ID="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id'
          )"
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGE_DIR"' EXIT

          FINAL_NAMES=(
            "PinDB-${VERSION}-macos-arm64.pkg"
            "PinDB-${VERSION}-macos-arm64.pkg.sha256"
            "PinDB-${VERSION}-macos-x64.pkg"
            "PinDB-${VERSION}-macos-x64.pkg.sha256"
          )

          declare -A STAGE_NAMES
          declare -A STAGE_IDS
          declare -A ORIGINAL_IDS
          declare -A LOCAL_DIGESTS
          declare -A LOCAL_SIZES

          temporary_name() {
            local final_name="$1"
            local kind="$2"
            if [[ "$final_name" == *.pkg.sha256 ]]; then
              printf '%s.%s-%s.pkg.sha256' \
                "${final_name%.pkg.sha256}" \
                "$kind" \
                "$RUN_KEY"
            elif [[ "$final_name" == *.pkg ]]; then
              printf '%s.%s-%s.pkg' \
                "${final_name%.pkg}" \
                "$kind" \
                "$RUN_KEY"
            else
              printf '%s.%s-%s' "$final_name" "$kind" "$RUN_KEY"
            fi
          }

          asset_id_by_name() {
            local name="$1"
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' \
              | head -n 1
          }

          asset_field_by_id() {
            local id="$1"
            local field="$2"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" --jq ".$field"
          }

          rename_asset() {
            local id="$1"
            local name="$2"
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -f name="$name" \
              >/dev/null
          }

          delete_asset() {
            local id="$1"
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              >/dev/null
          }

          cleanup_staged_uploads() {
            set +e
            for final_name in "${FINAL_NAMES[@]}"; do
              local stage_name="${STAGE_NAMES[$final_name]}"
              local stage_id
              stage_id="$(asset_id_by_name "$stage_name")"
              if [[ -n "$stage_id" ]]; then
                delete_asset "$stage_id" || true
              fi
            done
            set -e
          }

          for final_name in "${FINAL_NAMES[@]}"; do
            stage_name="$(temporary_name "$final_name" stage)"
            STAGE_NAMES["$final_name"]="$stage_name"
            cp "release-assets/$final_name" "$STAGE_DIR/$stage_name"
            LOCAL_DIGESTS["$final_name"]="sha256:$(sha256sum "release-assets/$final_name" | awk '{print $1}')"
            LOCAL_SIZES["$final_name"]="$(stat -c '%s' "release-assets/$final_name")"
          done

          if ! gh release upload \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$STAGE_DIR"/*; then
            echo "Staging the replacement assets failed; the existing release assets were not modified."
            cleanup_staged_uploads
            exit 1
          fi

          for final_name in "${FINAL_NAMES[@]}"; do
            stage_name="${STAGE_NAMES[$final_name]}"
            stage_id=""

            for attempt in {1..10}; do
              stage_id="$(asset_id_by_name "$stage_name")"
              if [[ -n "$stage_id" ]]; then
                remote_state="$(asset_field_by_id "$stage_id" state || true)"
                remote_digest="$(asset_field_by_id "$stage_id" digest || true)"
                remote_size="$(asset_field_by_id "$stage_id" size || true)"
                if [[ "$remote_state" == "uploaded" \
                      && "$remote_digest" == "${LOCAL_DIGESTS[$final_name]}" \
                      && "$remote_size" == "${LOCAL_SIZES[$final_name]}" ]]; then
                  break
                fi
              fi
              stage_id=""
              sleep 2
            done

            if [[ -z "$stage_id" ]]; then
              echo "Staged asset failed server-side digest/size verification: $stage_name"
              cleanup_staged_uploads
              exit 1
            fi

            STAGE_IDS["$final_name"]="$stage_id"
          done

          for final_name in "${FINAL_NAMES[@]}"; do
            ORIGINAL_IDS["$final_name"]="$(asset_id_by_name "$final_name")"
          done

          rollback() {
            local exit_code=$?
            trap - ERR
            set +e
            echo "Publication failed; restoring the pre-run macOS release asset names."

            for final_name in "${FINAL_NAMES[@]}"; do
              old_id="${ORIGINAL_IDS[$final_name]}"
              current_id="$(asset_id_by_name "$final_name")"

              if [[ -n "$old_id" ]]; then
                old_name="$(asset_field_by_id "$old_id" name 2>/dev/null)"
                if [[ "$old_name" != "$final_name" ]]; then
                  if [[ -n "$current_id" && "$current_id" != "$old_id" ]]; then
                    rename_asset \
                      "$current_id" \
                      "$(temporary_name "$final_name" failed)" \
                      || true
                  fi
                  rename_asset "$old_id" "$final_name" || true
                fi
              elif [[ -n "$current_id" && "$current_id" == "${STAGE_IDS[$final_name]}" ]]; then
                rename_asset \
                  "$current_id" \
                  "$(temporary_name "$final_name" failed)" \
                  || true
              fi
            done

            echo "Old assets were retained server-side for rollback. Any staged/failed assets are intentionally left for recovery if cleanup could not complete."
            exit "$exit_code"
          }
          trap rollback ERR

          for final_name in "${FINAL_NAMES[@]}"; do
            old_id="${ORIGINAL_IDS[$final_name]}"
            if [[ -n "$old_id" ]]; then
              rename_asset \
                "$old_id" \
                "$(temporary_name "$final_name" backup)"
            fi
          done

          for final_name in "${FINAL_NAMES[@]}"; do
            rename_asset \
              "${STAGE_IDS[$final_name]}" \
              "$final_name"
          done

          for final_name in "${FINAL_NAMES[@]}"; do
            published_id="$(asset_id_by_name "$final_name")"
            if [[ "$published_id" != "${STAGE_IDS[$final_name]}" ]]; then
              echo "Unexpected published asset identity for $final_name."
              false
            fi

            published_digest="$(asset_field_by_id "$published_id" digest)"
            published_size="$(asset_field_by_id "$published_id" size)"
            if [[ "$published_digest" != "${LOCAL_DIGESTS[$final_name]}" \
                  || "$published_size" != "${LOCAL_SIZES[$final_name]}" ]]; then
              echo "Published asset failed digest/size verification: $final_name"
              false
            fi
          done

          trap - ERR

          for final_name in "${FINAL_NAMES[@]}"; do
            old_id="${ORIGINAL_IDS[$final_name]}"
            if [[ -n "$old_id" ]]; then
              if ! delete_asset "$old_id"; then
                echo "::warning::Published replacement is verified, but the backup asset could not be deleted for $final_name."
              fi
            fi
          done

          echo "Published and verified four macOS release assets without destructive clobbering."
