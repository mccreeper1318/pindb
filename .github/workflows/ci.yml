name: Build and Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package-deb:
    name: Test and build Debian package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build Debian package
        run: ./gradlew --no-daemon clean test packageDeb

      - name: Verify packaged Debian update helper
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PACKAGES < <(find build/packages -maxdepth 1 -type f -name '*.deb')
          if [[ "${#PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one Debian package; found ${#PACKAGES[@]}."
            exit 1
          fi
          EXTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "$EXTRACT_DIR"' EXIT
          dpkg-deb -x "${PACKAGES[0]}" "$EXTRACT_DIR"
          mapfile -t HELPERS < <(find "$EXTRACT_DIR" -type f -path '*/bin/pindb-update-helper')
          if [[ "${#HELPERS[@]}" -ne 1 || ! -x "${HELPERS[0]:-}" ]]; then
            echo "The Debian package must contain exactly one executable PinDB update helper."
            printf '%s\n' "${HELPERS[@]}"
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pindb-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: pindb-deb
          path: build/packages/*.deb
          if-no-files-found: error

  test-and-package-rpm:
    name: Test and build Fedora RPM
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest

    steps:
      - name: Install Fedora build tools
        run: |
          dnf install -y \
            git \
            rpm-build \
            desktop-file-utils \
            cpio \
            findutils \
            gzip \
            tar \
            which

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build RPM package
        run: ./gradlew --no-daemon clean test packageRpm

      - name: Verify RPM metadata and desktop integration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PACKAGES < <(find build/packages -maxdepth 1 -type f -name '*.rpm')
          if [[ "${#PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one RPM package; found ${#PACKAGES[@]}."
            printf '%s\n' "${PACKAGES[@]}"
            exit 1
          fi

          RPM="${PACKAGES[0]}"
          rpm -qpi "$RPM"
          rpm -qpl "$RPM"

          RPM_SCRIPTS="$(rpm -qp --scripts "$RPM")"
          if grep -Fq 'rpm -q --whatprovides' <<< "$RPM_SCRIPTS"; then
            echo "RPM scriptlets must not start a nested rpm ownership query."
            printf '%s\n' "$RPM_SCRIPTS"
            exit 1
          fi
          if ! grep -Fq 'if [ "$1" -eq 0 ]; then' <<< "$RPM_SCRIPTS"; then
            echo "RPM desktop cleanup must be restricted to a real uninstall."
            printf '%s\n' "$RPM_SCRIPTS"
            exit 1
          fi

          EXTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "$EXTRACT_DIR"' EXIT
          (
            cd "$EXTRACT_DIR"
            rpm2cpio "$GITHUB_WORKSPACE/$RPM" | cpio -idmu
          )

          mapfile -t HELPERS < <(find "$EXTRACT_DIR" -type f -path '*/bin/pindb-update-helper')
          if [[ "${#HELPERS[@]}" -ne 1 || ! -x "${HELPERS[0]:-}" ]]; then
            echo "The RPM must contain exactly one executable PinDB update helper."
            printf '%s\n' "${HELPERS[@]}"
            exit 1
          fi

          mapfile -t DESKTOP_FILES < <(find "$EXTRACT_DIR" -type f -iname '*pindb*.desktop')
          if [[ "${#DESKTOP_FILES[@]}" -ne 1 ]]; then
            echo "Expected exactly one PinDB desktop entry; found ${#DESKTOP_FILES[@]}."
            printf '%s\n' "${DESKTOP_FILES[@]}"
            exit 1
          fi

          DESKTOP_FILE="${DESKTOP_FILES[0]}"
          desktop-file-validate "$DESKTOP_FILE"

          if ! grep -Eq '^Exec=.*/PinDB([[:space:]]|$)' "$DESKTOP_FILE"; then
            echo "The desktop entry does not reference the packaged PinDB launcher."
            cat "$DESKTOP_FILE"
            exit 1
          fi

          if ! grep -Eq '^Icon=.+' "$DESKTOP_FILE"; then
            echo "The desktop entry does not define an icon."
            cat "$DESKTOP_FILE"
            exit 1
          fi

          if ! find "$EXTRACT_DIR" -type f -iname '*pindb*.png' -print -quit | grep -q .; then
            echo "The RPM does not contain a PinDB PNG icon."
            exit 1
          fi

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v4
        with:
          name: pindb-rpm
          path: build/packages/*.rpm
          if-no-files-found: error
