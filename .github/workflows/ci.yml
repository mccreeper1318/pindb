name: Build and Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package-deb:
    name: Test and build Debian package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build Debian package
        run: ./gradlew --no-daemon clean test packageDeb

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pindb-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: pindb-deb
          path: build/packages/*.deb
          if-no-files-found: error

  test-and-package-rpm:
    name: Test and build Fedora RPM
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest

    steps:
      - name: Install Fedora build tools
        run: |
          dnf install -y \
            git \
            java-21-openjdk-devel \
            rpm-build \
            findutils \
            gzip \
            tar \
            which

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build RPM package
        run: ./gradlew --no-daemon clean test packageRpm

      - name: Verify RPM metadata
        shell: bash
        run: |
          mapfile -t PACKAGES < <(find build/packages -maxdepth 1 -type f -name '*.rpm')
          if [[ "${#PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one RPM package; found ${#PACKAGES[@]}."
            printf '%s\n' "${PACKAGES[@]}"
            exit 1
          fi
          rpm -qpi "${PACKAGES[0]}"
          rpm -qpl "${PACKAGES[0]}"

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v4
        with:
          name: pindb-rpm
          path: build/packages/*.rpm
          if-no-files-found: error
