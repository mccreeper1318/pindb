name: Publish staged PinDB website

on:
  push:
    branches:
      - gh-pages
    paths:
      - .site-deploy/run.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cat .site-deploy/site.zip.b64.* | tr -d '\r\n' | base64 --decode > "$work/site.zip"
          unzip -q "$work/site.zip" -d "$work/site"

          git fetch origin main
          mkdir -p "$work/site/assets"
          git show origin/main:src/main/resources/org/pindb/app/icon.png > "$work/site/assets/icon.png"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$work/site/." .

      - name: Publish website-only branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PinDB Website Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish PinDB project website"
          git push origin HEAD:gh-pages
