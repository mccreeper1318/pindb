name: Issue 74 macOS package smoke test

on:
  push:
    branches:
      - 74-add-unsigned-macos-pkg-packaging

permissions:
  contents: read

jobs:
  package:
    name: Package macOS (${{ matrix.release_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            release_arch: arm64
            binary_arch: arm64
          - runner: macos-15-intel
            release_arch: x64
            binary_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.binary_arch }}"

      - name: Build tests and unsigned PKG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean test packageMacPkg -PappVersion="0.3-beta.999"

      - name: Verify PKG contents and metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="build/packages/PinDB-0.3-beta.999-macos-${{ matrix.release_arch }}.pkg"
          test -s "$PACKAGE"

          if pkgutil --check-signature "$PACKAGE" > signature.txt 2>&1; then
            cat signature.txt
            echo "Expected an unsigned package, but pkgutil reported a valid signature."
            exit 1
          fi
          cat signature.txt
          grep -qi "no signature" signature.txt

          echo "Package payload paths:"
          pkgutil --payload-files "$PACKAGE" | sed -n '1,80p'

          rm -rf expanded-pkg
          pkgutil --expand-full "$PACKAGE" expanded-pkg
          echo "Expanded Info.plist files:"
          find expanded-pkg -name Info.plist -print

          INFO_PLIST="$(find expanded-pkg -name Info.plist -path '*/Contents/Info.plist' -print -quit)"
          if [ -z "$INFO_PLIST" ]; then
            echo "Could not locate application Info.plist in expanded package."
            find expanded-pkg -maxdepth 8 -print
            exit 1
          fi
          APP_DIR="${INFO_PLIST%/Contents/Info.plist}"
          echo "App bundle: $APP_DIR"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          CATEGORY="$(/usr/libexec/PlistBuddy -c 'Print :LSApplicationCategoryType' "$INFO_PLIST")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")"
          echo "CFBundleIdentifier=$BUNDLE_ID"
          echo "CFBundleShortVersionString=$BUNDLE_VERSION"
          echo "LSApplicationCategoryType=$CATEGORY"
          echo "CFBundleExecutable=$EXECUTABLE"

          test "$BUNDLE_ID" = "org.pindb.PinDB"
          test "$BUNDLE_VERSION" = "1.3"
          test "$CATEGORY" = "public.app-category.productivity"

          LAUNCHER="$APP_DIR/Contents/MacOS/$EXECUTABLE"
          test -x "$LAUNCHER"
          echo "Launcher architectures: $(lipo -archs "$LAUNCHER")"
          lipo -archs "$LAUNCHER" | tr ' ' '\n' | grep -Fx "${{ matrix.binary_arch }}"

          JAVA_BIN="$(find "$APP_DIR/Contents/runtime" -type f -path '*/bin/java' -print -quit)"
          test -n "$JAVA_BIN"
          test -x "$JAVA_BIN"
          "$JAVA_BIN" -version
          echo "Bundled Java architectures: $(lipo -archs "$JAVA_BIN")"
          lipo -archs "$JAVA_BIN" | tr ' ' '\n' | grep -Fx "${{ matrix.binary_arch }}"

          MAIN_JAR="$(find "$APP_DIR/Contents/app" -maxdepth 1 -type f -name 'pindb-*.jar' -print -quit)"
          test -n "$MAIN_JAR"
          echo "Embedded PinDB version:"
          unzip -p "$MAIN_JAR" org/pindb/app/version.properties
          unzip -p "$MAIN_JAR" org/pindb/app/version.properties | grep -Fx 'version=0.3-beta.999'

      - name: Upload smoke-test PKG
        uses: actions/upload-artifact@v4
        with:
          name: issue-74-macos-${{ matrix.release_arch }}
          path: build/packages/PinDB-0.3-beta.999-macos-${{ matrix.release_arch }}.pkg
          if-no-files-found: error
