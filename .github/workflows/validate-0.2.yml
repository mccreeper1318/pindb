name: Validate PinDB 0.2

on:
  push:
    branches:
      - agent/0.2-dev
    paths:
      - tools/run_0_2_validation.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.2-dev
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run complete test suite
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test

      - name: Record successful validation
        run: |
          git config user.name "PinDB Development Automation"
          git config user.email "actions@users.noreply.github.com"
          printf 'PinDB 0.2 validation passed for %s\n' "$GITHUB_SHA" > tools/0.2-tests-passed.txt
          git add tools/0.2-tests-passed.txt
          git commit -m "Record successful 0.2 validation"
          git push origin HEAD:agent/0.2-dev
