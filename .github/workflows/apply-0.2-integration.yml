name: Apply 0.2 Integration

on:
  push:
    branches:
      - agent/0.2-dev
    paths:
      - tools/apply_0_2_integration.py
      - tools/run_0_2_integration.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.2-dev
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Apply source integration
        run: python3 tools/apply_0_2_integration.py

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test

      - name: Commit integrated source
        run: |
          git config user.name "PinDB Development Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No source changes were produced."
            exit 0
          fi
          git commit -m "Integrate 0.2 document fields and bug fixes"
          git push origin HEAD:agent/0.2-dev
