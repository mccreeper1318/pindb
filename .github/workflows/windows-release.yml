name: Build Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pindb-windows-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    name: Build Windows 11 x64 installer
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $raw = $env:RELEASE_TAG
          $version = $raw -replace '^v\.?', ''
          if ($version -notmatch '^\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') { throw "Invalid PinDB release tag: $raw" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install WiX
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Build and test Windows installer
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean test packageWindows -PappVersion="${{ steps.version.outputs.version }}"
          if (-not (Test-Path 'build\packages')) {
            throw 'packageWindows completed without creating build\packages. The Windows packaging task was skipped or did not run.'
          }
          $built = @(Get-ChildItem 'build\packages' -Filter '*.exe' -File)
          if ($built.Count -eq 0) {
            Get-ChildItem 'build' -Recurse | Select-Object FullName, Length
            throw 'packageWindows completed without producing an EXE installer.'
          }

      - name: Normalize and verify installer
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'build\packages' -Filter '*.exe' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one Windows EXE installer; found $($packages.Count)." }
          $target = Join-Path $packages[0].DirectoryName "PinDB-${{ steps.version.outputs.version }}-windows-x64.exe"
          Move-Item $packages[0].FullName $target -Force
          if ((Get-Item $target).Length -le 0) { throw 'Windows installer is empty.' }
          "package=$target" >> $env:GITHUB_OUTPUT

      - name: Generate and verify SHA-256 checksum
        shell: pwsh
        run: |
          $package = "${{ steps.package.outputs.package }}"
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $package -Leaf)" | Set-Content -Encoding ascii "$package.sha256"
          $expected = (Get-Content "$package.sha256" -Raw).Trim().Split()[0]
          $actual = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Generated Windows checksum did not verify.' }
          Get-Content "$package.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pindb-windows-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.package }}.sha256
          if-no-files-found: error

  publish:
    name: Attach Windows installer to release
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: pindb-windows-${{ needs.windows.outputs.version }}
          path: release-assets

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.windows.outputs.version }}"
          PACKAGE="PinDB-${VERSION}-windows-x64.exe"
          CHECKSUM="${PACKAGE}.sha256"

          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#FILES[@]}" -ne 2 ]]; then
            echo "Expected exactly two Windows release files; found ${#FILES[@]}."
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          for NAME in "$PACKAGE" "$CHECKSUM"; do
            if [[ ! -s "release-assets/$NAME" ]]; then
              echo "Missing or empty Windows release asset: $NAME"
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum -c "$CHECKSUM"
          )

      - name: Stage and publish Windows release files transactionally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          TAG="$RELEASE_TAG"
          VERSION="${{ needs.windows.outputs.version }}"
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGE_DIR"' EXIT

          PACKAGE="PinDB-${VERSION}-windows-x64.exe"
          CHECKSUM="${PACKAGE}.sha256"
          FINAL_NAMES=("$PACKAGE" "$CHECKSUM")
          PROMOTION_NAMES=("$CHECKSUM" "$PACKAGE")

          declare -A STAGE_NAMES
          declare -A STAGE_IDS
          declare -A ORIGINAL_IDS
          declare -A LOCAL_DIGESTS
          declare -A LOCAL_SIZES

          temporary_name() {
            local final_name="$1"
            local kind="$2"
            printf '%s.%s-%s' "$final_name" "$kind" "$RUN_KEY"
          }

          asset_id_by_name() {
            local name="$1"
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              | jq -r --arg name "$name" '.[] | select(.name == $name) | .id'
          }

          asset_field_by_id() {
            local id="$1"
            local field="$2"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" --jq ".$field"
          }

          rename_asset() {
            local id="$1"
            local name="$2"
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -f name="$name" >/dev/null
          }

          delete_asset() {
            local id="$1"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
          }

          cleanup_staged_uploads() {
            set +e
            for final_name in "${FINAL_NAMES[@]}"; do
              local stage_name="${STAGE_NAMES[$final_name]}"
              local stage_id
              stage_id="$(asset_id_by_name "$stage_name")"
              if [[ -n "$stage_id" ]]; then
                delete_asset "$stage_id" || true
              fi
            done
            set -e
          }

          for final_name in "${FINAL_NAMES[@]}"; do
            stage_name="$(temporary_name "$final_name" stage)"
            STAGE_NAMES["$final_name"]="$stage_name"
            cp "release-assets/$final_name" "$STAGE_DIR/$stage_name"
            LOCAL_DIGESTS["$final_name"]="sha256:$(sha256sum "release-assets/$final_name" | awk '{print $1}')"
            LOCAL_SIZES["$final_name"]="$(stat -c '%s' "release-assets/$final_name")"
          done

          if ! gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$STAGE_DIR"/*; then
            echo "Staging the replacement Windows assets failed; existing release assets were not modified."
            cleanup_staged_uploads
            exit 1
          fi

          for final_name in "${FINAL_NAMES[@]}"; do
            stage_name="${STAGE_NAMES[$final_name]}"
            stage_id=""

            for attempt in {1..10}; do
              stage_id="$(asset_id_by_name "$stage_name")"
              if [[ -n "$stage_id" ]]; then
                remote_state="$(asset_field_by_id "$stage_id" state || true)"
                remote_digest="$(asset_field_by_id "$stage_id" digest || true)"
                remote_size="$(asset_field_by_id "$stage_id" size || true)"
                if [[ "$remote_state" == "uploaded" \
                      && "$remote_digest" == "${LOCAL_DIGESTS[$final_name]}" \
                      && "$remote_size" == "${LOCAL_SIZES[$final_name]}" ]]; then
                  break
                fi
              fi
              stage_id=""
              sleep 2
            done

            if [[ -z "$stage_id" ]]; then
              echo "Staged Windows asset failed server-side digest/size verification: $stage_name"
              cleanup_staged_uploads
              exit 1
            fi

            STAGE_IDS["$final_name"]="$stage_id"
          done

          for final_name in "${FINAL_NAMES[@]}"; do
            ORIGINAL_IDS["$final_name"]="$(asset_id_by_name "$final_name")"
          done

          restore_original_asset() {
            local final_name="$1"
            local old_id="${ORIGINAL_IDS[$final_name]}"
            local current_id
            current_id="$(asset_id_by_name "$final_name")"

            if [[ -n "$old_id" ]]; then
              local old_name
              old_name="$(asset_field_by_id "$old_id" name 2>/dev/null || true)"
              if [[ "$old_name" != "$final_name" ]]; then
                if [[ -n "$current_id" && "$current_id" != "$old_id" ]]; then
                  rename_asset "$current_id" "$(temporary_name "$final_name" failed)" || true
                fi
                rename_asset "$old_id" "$final_name" || true
              fi
            elif [[ -n "$current_id" && "$current_id" == "${STAGE_IDS[$final_name]}" ]]; then
              rename_asset "$current_id" "$(temporary_name "$final_name" failed)" || true
            fi
          }

          rollback() {
            local exit_code="${1:-1}"
            trap - ERR INT TERM
            set +e
            echo "Windows publication failed or was interrupted; restoring the pre-run asset names."

            current_id="$(asset_id_by_name "$PACKAGE")"
            if [[ -n "$current_id" && "$current_id" == "${STAGE_IDS[$PACKAGE]}" ]]; then
              rename_asset "$current_id" "$(temporary_name "$PACKAGE" failed)" || true
            fi

            restore_original_asset "$CHECKSUM"
            restore_original_asset "$PACKAGE"

            echo "Original Windows assets were retained server-side for rollback."
            exit "$exit_code"
          }
          trap 'rollback $?' ERR
          trap 'rollback 130' INT
          trap 'rollback 143' TERM

          # Hide the old package before its checksum so clients never see a
          # canonical package without the checksum that belongs to it.
          old_package_id="${ORIGINAL_IDS[$PACKAGE]}"
          if [[ -n "$old_package_id" ]]; then
            rename_asset "$old_package_id" "$(temporary_name "$PACKAGE" backup)"
          fi

          old_checksum_id="${ORIGINAL_IDS[$CHECKSUM]}"
          if [[ -n "$old_checksum_id" ]]; then
            rename_asset "$old_checksum_id" "$(temporary_name "$CHECKSUM" backup)"
          fi

          # Publish the checksum first, then the installer, so every visible
          # canonical installer has its matching checksum available.
          for final_name in "${PROMOTION_NAMES[@]}"; do
            rename_asset "${STAGE_IDS[$final_name]}" "$final_name"
          done

          for final_name in "${FINAL_NAMES[@]}"; do
            published_id="$(asset_id_by_name "$final_name")"
            if [[ "$published_id" != "${STAGE_IDS[$final_name]}" ]]; then
              echo "Unexpected published Windows asset identity for $final_name."
              false
            fi

            published_digest="$(asset_field_by_id "$published_id" digest)"
            published_size="$(asset_field_by_id "$published_id" size)"
            if [[ "$published_digest" != "${LOCAL_DIGESTS[$final_name]}" \
                  || "$published_size" != "${LOCAL_SIZES[$final_name]}" ]]; then
              echo "Published Windows asset failed digest/size verification: $final_name"
              false
            fi
          done

          trap - ERR INT TERM

          for final_name in "${FINAL_NAMES[@]}"; do
            old_id="${ORIGINAL_IDS[$final_name]}"
            if [[ -n "$old_id" ]]; then
              delete_asset "$old_id"
            fi
          done

          echo "Published and verified Windows installer and checksum for $TAG."
