name: Build Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  windows:
    name: Build Windows 11 x64 installer
    runs-on: windows-2025
    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $raw = $env:RELEASE_TAG
          $version = $raw -replace '^v\.?', ''
          if ($version -notmatch '^\d+\.\d+(\.\d+)*(-[0-9A-Za-z.-]+)?$') { throw "Invalid PinDB release tag: $raw" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install WiX
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Build and test Windows installer
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean test packageWindows -PappVersion="${{ steps.version.outputs.version }}"
          if (-not (Test-Path 'build\packages')) {
            throw 'packageWindows completed without creating build\packages. The Windows packaging task was skipped or did not run.'
          }
          $built = @(Get-ChildItem 'build\packages' -Filter '*.exe' -File)
          if ($built.Count -eq 0) {
            Get-ChildItem 'build' -Recurse | Select-Object FullName, Length
            throw 'packageWindows completed without producing an EXE installer.'
          }

      - name: Normalize and verify installer
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'build\packages' -Filter '*.exe' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one Windows EXE installer; found $($packages.Count)." }
          $target = Join-Path $packages[0].DirectoryName "PinDB-${{ steps.version.outputs.version }}-windows-x64.exe"
          Move-Item $packages[0].FullName $target -Force
          if ((Get-Item $target).Length -le 0) { throw 'Windows installer is empty.' }
          "package=$target" >> $env:GITHUB_OUTPUT

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $package = "${{ steps.package.outputs.package }}"
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $package -Leaf)" | Set-Content -Encoding ascii "$package.sha256"
          Get-Content "$package.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pindb-windows-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.package }}.sha256
          if-no-files-found: error

      - name: Attach Windows installer to release
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" "${{ steps.package.outputs.package }}" "${{ steps.package.outputs.package }}.sha256" --clobber
