name: Issue 76 macOS staging cleanup smoke

on:
  push:
    branches:
      - 76-add-automatic-macos-update-discovery-and-installation

permissions:
  contents: read

jobs:
  mac-cleanup:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Verify detached protected staging cleanup
        shell: bash
        run: |
          set -euo pipefail
          source_pkg="$(mktemp /tmp/PinDB-source.XXXXXX.pkg)"
          printf 'verified package bytes\n' > "$source_pkg"
          digest="$(/usr/bin/shasum -a 256 "$source_pkg" | /usr/bin/cut -d ' ' -f 1)"

          staged="$(sudo /bin/sh -c 'umask 077; stageDir=$(/usr/bin/mktemp -d /private/var/tmp/PinDB-verified-update.XXXXXXXX); packagePath="$stageDir/PinDB-verified-update.pkg"; trap '\''/bin/rm -rf "$stageDir"'\'' EXIT HUP INT TERM; /usr/bin/install -o root -g wheel -m 0400 "$1" "$packagePath"; actual=$(/usr/bin/shasum -a 256 "$packagePath" | /usr/bin/cut -d " " -f 1); [ "$actual" = "$2" ] || exit 65; /usr/sbin/chown root:wheel "$stageDir" "$packagePath"; /bin/chmod 0755 "$stageDir"; /bin/chmod 0444 "$packagePath"; [ -x /usr/bin/nohup ] && [ -x /bin/sleep ] || exit 69; /usr/bin/nohup /bin/sh -c '\''/bin/sleep "$1"; /bin/rm -rf "$2"'\'' pindb-cleanup 2 "$stageDir" >/dev/null 2>&1 </dev/null & cleanupPid=$!; [ -n "$cleanupPid" ] || exit 69; /usr/bin/printf "%s\n" "$packagePath"; trap - EXIT HUP INT TERM' -- "$source_pkg" "$digest")"

          test -f "$staged"
          test "$(stat -f '%u' "$staged")" = "0"
          test "$(stat -f '%Lp' "$staged")" = "444"
          test "$(/usr/bin/shasum -a 256 "$staged" | /usr/bin/cut -d ' ' -f 1)" = "$digest"

          stage_dir="$(dirname "$staged")"
          /bin/sleep 5
          test ! -e "$staged"
          test ! -e "$stage_dir"
          /bin/rm -f "$source_pkg"
