name: Apply Help and Bug Reporter

on:
  push:
    branches:
      - agent/0.2-dev
    paths:
      - tools/run_help_bug_report.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.2-dev
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Apply integration
        run: python3 tools/apply_help_bug_report.py
      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test
      - name: Commit integrated source
        run: |
          git config user.name "PinDB Development Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src build.gradle CHANGELOG.md
          git commit -m "Add update history and in-app bug reporting"
          git push origin HEAD:agent/0.2-dev
