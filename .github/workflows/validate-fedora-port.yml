name: Validate Fedora Port

on:
  push:
    branches:
      - agent/0.2-dev
    paths:
      - tools/run-fedora-port-validation.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.2-dev
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Debian build
        id: deb
        shell: bash
        run: |
          set +e
          sudo apt-get update > tools/fedora-port-deb-validation.txt 2>&1
          sudo apt-get install -y fakeroot >> tools/fedora-port-deb-validation.txt 2>&1
          chmod +x gradlew
          ./gradlew --no-daemon clean test packageDeb >> tools/fedora-port-deb-validation.txt 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          tail -n 300 tools/fedora-port-deb-validation.txt
          exit 0

      - name: Validate Fedora RPM build
        id: rpm
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:latest \
            bash -lc '
              dnf install -y git java-21-openjdk-devel rpm-build desktop-file-utils cpio findutils gzip tar which &&
              chmod +x gradlew &&
              ./gradlew --no-daemon clean test packageRpm &&
              mapfile -t PACKAGES < <(find build/packages -maxdepth 1 -type f -name "*.rpm") &&
              test "${#PACKAGES[@]}" -eq 1 &&
              RPM="${PACKAGES[0]}" &&
              rpm -qpi "$RPM" &&
              rpm -qpl "$RPM" &&
              EXTRACT_DIR="$(mktemp -d)" &&
              cd "$EXTRACT_DIR" &&
              rpm2cpio "/workspace/$RPM" | cpio -idmu &&
              mapfile -t DESKTOP_FILES < <(find . -type f -path "*/applications/*.desktop") &&
              test "${#DESKTOP_FILES[@]}" -eq 1 &&
              desktop-file-validate "${DESKTOP_FILES[0]}" &&
              find . -type f -iname "*pindb*.png" -print -quit | grep -q .
            ' > tools/fedora-port-rpm-validation.txt 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          tail -n 300 tools/fedora-port-rpm-validation.txt
          exit 0

      - name: Record validation result
        shell: bash
        run: |
          git config user.name "PinDB Development Automation"
          git config user.email "actions@users.noreply.github.com"
          if [[ "${{ steps.deb.outputs.status }}" = "0" && "${{ steps.rpm.outputs.status }}" = "0" ]]; then
            printf 'Fedora port validation passed for %s\n' "$GITHUB_SHA" > tools/fedora-port-validation-result.txt
          else
            printf 'Fedora port validation failed for %s (deb=%s rpm=%s)\n' \
              "$GITHUB_SHA" "${{ steps.deb.outputs.status }}" "${{ steps.rpm.outputs.status }}" \
              > tools/fedora-port-validation-result.txt
          fi
          git add tools/fedora-port-validation-result.txt \
            tools/fedora-port-deb-validation.txt \
            tools/fedora-port-rpm-validation.txt
          git commit -m "Record Fedora port validation result"
          git push origin HEAD:agent/0.2-dev

      - name: Fail when validation fails
        if: steps.deb.outputs.status != '0' || steps.rpm.outputs.status != '0'
        run: exit 1
