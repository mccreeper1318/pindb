name: Windows CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install WiX
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
      - name: Run Windows tests and build installer
        shell: pwsh
        run: |
          & .\gradlew.bat --no-daemon clean check packageWindows -PappVersion="0.3.2-ci.1"
          if ($LASTEXITCODE -ne 0) {
            throw "Gradle Windows CI build failed with exit code $LASTEXITCODE."
          }
      - name: Verify installer output
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'build\packages' -Filter '*.exe' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Windows EXE installer; found $($packages.Count)."
          }
          if ($packages[0].Length -le 0) {
            throw 'Windows installer is empty.'
          }
      - name: Smoke-test Windows installer safety
        shell: pwsh
        run: .\scripts\windows-installer-safety-smoke.ps1
