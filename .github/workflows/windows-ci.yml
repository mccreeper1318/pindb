name: Windows CI

on:
  push:
    branches: ['34-release-windows-support']
  pull_request:

jobs:
  windows-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run Windows tests
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean test
