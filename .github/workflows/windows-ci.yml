name: Windows CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install WiX
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
      - name: Run Windows tests and build installer
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean test packageWindows -PappVersion="0.3.2-ci.1"
      - name: Verify installer output
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'build\packages' -Filter '*.exe' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Windows EXE installer; found $($packages.Count)."
          }
          if ($packages[0].Length -le 0) {
            throw 'Windows installer is empty.'
          }
