name: Issue 76 unique macOS staging smoke

on:
  push:
    branches:
      - 76-add-automatic-macos-update-discovery-and-installation

permissions:
  contents: read

jobs:
  mac-staging:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Verify unique protected staging
        shell: bash
        run: |
          set -euo pipefail
          source_pkg="$(mktemp /tmp/PinDB-source.XXXXXX.pkg)"
          printf 'verified package bytes\n' > "$source_pkg"
          digest="$(/usr/bin/shasum -a 256 "$source_pkg" | /usr/bin/cut -d ' ' -f 1)"

          stage_once() {
            sudo /bin/sh -c 'umask 077; stageDir=$(/usr/bin/mktemp -d /private/var/tmp/PinDB-verified-update.XXXXXXXX); packagePath="$stageDir/PinDB-verified-update.pkg"; trap '\''/bin/rm -rf "$stageDir"'\'' EXIT HUP INT TERM; /usr/bin/install -o root -g wheel -m 0400 "$1" "$packagePath"; actual=$(/usr/bin/shasum -a 256 "$packagePath" | /usr/bin/cut -d " " -f 1); [ "$actual" = "$2" ] || exit 65; /usr/sbin/chown root:wheel "$stageDir" "$packagePath"; /bin/chmod 0755 "$stageDir"; /bin/chmod 0444 "$packagePath"; /usr/bin/printf "%s\n" "$packagePath"; trap - EXIT HUP INT TERM' -- "$source_pkg" "$digest"
          }

          first="$(stage_once)"
          second="$(stage_once)"

          test "$first" != "$second"
          case "$first" in
            /private/var/tmp/PinDB-verified-update.*/PinDB-verified-update.pkg) ;;
            *) echo "Unexpected first staging path: $first"; exit 1 ;;
          esac
          case "$second" in
            /private/var/tmp/PinDB-verified-update.*/PinDB-verified-update.pkg) ;;
            *) echo "Unexpected second staging path: $second"; exit 1 ;;
          esac

          test "$(stat -f '%u' "$first")" = "0"
          test "$(stat -f '%Lp' "$first")" = "444"
          test "$(stat -f '%u' "$(dirname "$first")")" = "0"
          test "$(stat -f '%Lp' "$(dirname "$first")")" = "755"
          test "$(/usr/bin/shasum -a 256 "$first" | /usr/bin/cut -d ' ' -f 1)" = "$digest"
          test "$(/usr/bin/shasum -a 256 "$second" | /usr/bin/cut -d ' ' -f 1)" = "$digest"

          sudo /bin/rm -rf "$(dirname "$first")" "$(dirname "$second")"
          /bin/rm -f "$source_pkg"
