name: Validate Beta 3 Bug Reporter

on:
  push:
    branches:
      - agent/0.2-dev
    paths:
      - tools/run_beta_3_bug_reporter_validation.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.2-dev
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run complete test suite
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test
      - name: Record successful validation
        run: |
          git config user.name "PinDB Development Automation"
          git config user.email "actions@users.noreply.github.com"
          printf 'Beta 3 bug reporter validation passed for %s\n' "$GITHUB_SHA" > tools/beta-3-bug-reporter-tests-passed.txt
          git add tools/beta-3-bug-reporter-tests-passed.txt
          git commit -m "Record beta 3 bug reporter validation"
          git push origin HEAD:agent/0.2-dev
