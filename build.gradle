plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group = 'org.pindb'
version = providers.gradleProperty('appVersion')
        .orElse('0.0.0-dev')
        .get()

def semanticVersion = project.version.toString()
def semanticParts = semanticVersion.split('-', 2)
def linuxAppVersion = semanticParts[0]
def linuxAppRelease = semanticParts.length == 2
        ? "0~${semanticParts[1].replace('-', '.')}"
        : '1'

def javafxVersion = '21.0.8'
def sqliteVersion = '3.53.2.1'
def slf4jVersion = '2.0.17'

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def javafxPlatform = osName.contains('linux')
        ? (osArch.contains('aarch64') || osArch.contains('arm64') ? 'linux-aarch64' : 'linux')
        : osName.contains('mac')
        ? (osArch.contains('aarch64') || osArch.contains('arm64') ? 'mac-aarch64' : 'mac')
        : 'win'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation "org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}"
    implementation "org.xerial:sqlite-jdbc:${sqliteVersion}"
    runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.pindb.PinDBLauncher'
    applicationName = 'PinDB'
    applicationDefaultJvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dprism.order=es2,sw'
    ]
}

base {
    archivesName = 'pindb'
}

jar {
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'PinDB',
                'Implementation-Version': project.version
        )
    }
}

processResources {
    filesMatching('org/pindb/app/version.properties') {
        expand(version: project.version)
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('packageDeb', org.gradle.api.tasks.Exec) {
    group = 'distribution'
    description = 'Builds a self-contained Debian package with jpackage.'
    dependsOn tasks.installDist

    onlyIf {
        osName.contains('linux')
    }

    def packagesDir = layout.buildDirectory.dir('packages').get().asFile
    def inputDir = layout.buildDirectory.dir('install/PinDB/lib').get().asFile
    def mainJar = "pindb-${project.version}.jar"
    def iconFile = file('src/main/resources/org/pindb/app/icon.png')
    def associations = file('packaging/pindb-file-associations.properties')

    doFirst {
        if (packagesDir.exists()) {
            packagesDir.deleteDir()
        }

        if (!packagesDir.mkdirs() && !packagesDir.isDirectory()) {
            throw new GradleException(
                    "Unable to create package directory: ${packagesDir}"
            )
        }
    }

    commandLine 'jpackage',
            '--type', 'deb',
            '--dest', packagesDir.absolutePath,
            '--input', inputDir.absolutePath,
            '--name', 'PinDB',
            '--app-version', linuxAppVersion,
            '--linux-app-release', linuxAppRelease,
            '--vendor', 'PinDB Project',
            '--description', 'A flexible personal database application.',
            '--main-jar', mainJar,
            '--main-class', application.mainClass.get(),
            '--icon', iconFile.absolutePath,
            '--install-dir', '/opt/pindb',
            '--linux-package-name', 'pindb',
            '--linux-menu-group', 'Office',
            '--linux-shortcut',
            '--file-associations', associations.absolutePath,
            '--java-options', '-Dfile.encoding=UTF-8',
            '--java-options', '-Dprism.order=es2,sw'
}

tasks.register('verifyReleaseTag') {
    group = 'verification'
    description = 'Validates PinDB release tag formats such as 0.1, v0.1, v.0.1 and 0.2-beta.1.'
    doLast {
        def tag = providers.gradleProperty('releaseTag').orNull
        if (tag == null || !(tag ==~ /^(?:v\.?)?\d+\.\d+(?:\.\d+)*(?:-[0-9A-Za-z.-]+)?$/)) {
            throw new GradleException("Invalid PinDB release tag: ${tag}")
        }
    }
}
